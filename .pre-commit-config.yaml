      - id: docker-security
        name: "Docker | Seguranca"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area docker --stage security
        language: system
        pass_filenames: false
        always_run: true

      - id: kubernetes-lint
        name: "Kubernetes | Lint"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area kubernetes --stage lint
        language: system
        pass_filenames: false
        always_run: true

      - id: kubernetes-validate
        name: "Kubernetes | Validate"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area kubernetes --stage validate
        language: system
        pass_filenames: false
        always_run: true

      - id: kubernetes-test
        name: "Kubernetes | Testes"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area kubernetes --stage test
        language: system
        pass_filenames: false
        always_run: true

      - id: kubernetes-security
        name: "Kubernetes | Seguranca"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area kubernetes --stage security
        language: system
        pass_filenames: false
        always_run: true

      - id: json-lint
        name: "JSON | Lint"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area json --stage lint
        language: system
        pass_filenames: false
        always_run: true

      - id: json-validate
        name: "JSON | Validate"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area json --stage validate
        language: system
        pass_filenames: false
        always_run: true

      - id: commitlint
        name: "Commit | Lint"
        entry: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --config linters/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]

      - id: stack-clean
        name: "Stack | Limpeza"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --stage clean
        language: system
        pass_filenames: false
        always_run: true
