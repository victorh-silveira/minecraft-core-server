minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        name: "Codigo | Lint Python (Ruff)"
        args: [--fix, --config, app/pyproject.toml]
        files: ^app/(src/infrastructure/mods|tests)/

      - id: ruff-format
        name: "Codigo | Formatar Python (Ruff)"
        args: [--config, app/pyproject.toml]
        files: ^app/(src/infrastructure/mods|tests)/

  - repo: local
    hooks:
      - id: terraform-fmt
        name: "Infra | Formatar Terraform"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/ci-infra-local.sh fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-validate
        name: "Infra | Validar Terraform (tflint, tfsec, validate)"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/ci-infra-local.sh validate
        language: system
        pass_filenames: false
        always_run: true

      - id: commitlint
        name: "Commit | Validar Conventional Commits"
        entry: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --config app/tools/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: "Workflows | Lint GitHub Actions"
        files: ^\.github/workflows/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: "Docker | Lint Dockerfile"
        files: ^infra/docker/Dockerfile$
        args: [--ignore=DL3006]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: "Infra | Validar sintaxe YAML"
        files: ^(infra/kubernetes/|\.github/workflows/)
        exclude: |
          (?x)^(
            \.github/workflows/templates/|
            infra/kubernetes/base/rbac-world-backup\.yaml|
            infra/kubernetes/overlays/.*/patches/
          )

      - id: check-json
        name: "Codigo | Validar JSON (manifesto de mods)"
        files: ^app/src/interface/mods/mods-manifest\.json$

      - id: end-of-file-fixer
        name: "Arquivo | Garantir newline no fim"
        exclude: ^app/src/domain/world-data/

      - id: trailing-whitespace
        name: "Arquivo | Remover espacos no fim da linha"
        exclude: ^app/src/domain/world-data/
