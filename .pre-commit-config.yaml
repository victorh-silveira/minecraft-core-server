minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: python-lint
        name: "Python | Lint"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area python --stage lint
        language: system
        pass_filenames: false
        always_run: true

      - id: python-validate
        name: "Python | Validate"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area python --stage validate
        language: system
        pass_filenames: false
        always_run: true

      - id: python-test
        name: "Python | Testes"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 100
        language: system
        pass_filenames: false
        always_run: true

      - id: python-security
        name: "Python | Seguranca"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area python --stage security
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-lint
        name: "Terraform | Lint"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area terraform --stage lint
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-validate
        name: "Terraform | Validate"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area terraform --stage validate
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-test
        name: "Terraform | Testes"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area terraform --stage test
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-security
        name: "Terraform | Seguranca"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area terraform --stage security
        language: system
        pass_filenames: false
        always_run: true

      - id: docker-lint
        name: "Docker | Lint"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area docker --stage lint
        language: system
        pass_filenames: false
        always_run: true

      - id: docker-validate
        name: "Docker | Validate"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area docker --stage validate
        language: system
        pass_filenames: false
        always_run: true

      - id: docker-test
        name: "Docker | Testes"
        entry: bash app/scripts/bash/run-in-linux-env.sh bash app/scripts/bash/run-in-dev-env.sh python app/scripts/operations/clean_workspace.py --area docker --stage test
        language: system
        pass_filenames: false
