name: CI - Integracao Continua

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: CI - Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint codigo
        uses: ./.github/actions/ci/lint-code

      - name: Lint infra
        uses: ./.github/actions/ci/lint-infra

  validate:
    name: CI - Validacao
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testes
        uses: ./.github/actions/ci/test

      - name: Seguranca
        uses: ./.github/actions/ci/security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar Docker
        uses: ./.github/actions/ci/validate-docker

      - name: Validar Kubernetes
        uses: ./.github/actions/ci/validate-kubernetes

      - name: Validar Terraform
        uses: ./.github/actions/ci/validate-terraform

  deploy-infra:
    name: CD - Deploy Infra (GitOps)
    needs: [linter, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Detectar alteracoes na infraestrutura
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/terraform/**'
              - 'infra/modules/**'

      - name: Autenticar no Azure para verificacao
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar se a infraestrutura esta ativa
        id: check-infra
        shell: bash
        run: |
          echo "Verificando se o AKS 'aks-minecraft-server-prod' existe..."
          if az aks show --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod --query id -o tsv >/dev/null 2>&1; then
            echo "AKS encontrado. Infraestrutura ativa."
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "AKS nao encontrado! Forcando criacao da infraestrutura completa."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy infraestrutura
        if: steps.check-infra.outputs.active == 'false' || steps.filter.outputs.infra == 'true' || contains(github.event.head_commit.message, '[force-infra]')
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          confirm_token: "APPLY_INFRA"

  release:
    name: CI - Versao semantica
    needs: [deploy-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    outputs:
      tag: ${{ steps.after_tag.outputs.tag }}
      published: ${{ steps.after_tag.outputs.published }}

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Capturar tag anterior
        id: before_tag
        shell: bash
        run: |
          git fetch --tags --force
          BEFORE="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${BEFORE}" >> "$GITHUB_OUTPUT"

      - name: Sincronizar tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release semantico
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capturar tag apos release
        id: after_tag
        shell: bash
        run: |
          git fetch origin main --tags --force
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before_tag.outputs.tag }}" != "$NEW" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-app:
    name: CD - Deploy App
    needs: [release]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver whitelist
        id: whitelist
        shell: bash
        run: |
          NICKS="${{ secrets.MINECRAFT_WHITELIST }}"
          if [ -z "${NICKS}" ]; then
            NICKS="AnonymousNoobz"
          fi
          echo "nicks=${NICKS}" >> "$GITHUB_OUTPUT"

      - name: Deploy aplicacao
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ needs.release.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}
          minecraft_whitelist: ${{ steps.whitelist.outputs.nicks }}

  post-deploy:
    name: CD - Pos-deploy
    needs: [deploy-app]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Autenticar no Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Credenciais AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-minecraft-server-prod
          cluster-name: aks-minecraft-server-prod

      - name: Testes pos-deploy
        uses: ./.github/actions/cd/post-deploy
