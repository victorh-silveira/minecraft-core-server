name: CI - Integracao Continua

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: CI - Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint codigo
        uses: ./.github/actions/ci/lint-code

      - name: Lint infra
        uses: ./.github/actions/ci/lint-infra

  validate:
    name: CI - Validacao
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testes
        uses: ./.github/actions/ci/test

      - name: Seguranca
        uses: ./.github/actions/ci/security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar Docker
        uses: ./.github/actions/ci/validate-docker

      - name: Validar Kubernetes
        uses: ./.github/actions/ci/validate-kubernetes

      - name: Validar Terraform
        uses: ./.github/actions/ci/validate-terraform

  deploy-infra:
    name: CD - Deploy Infra (GitOps)
    needs: [linter, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Detectar alteracoes na infraestrutura
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/terraform/**'
              - 'infra/modules/**'

      - name: Autenticar no Azure para verificacao
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar se a infraestrutura esta ativa
        id: check-infra
        shell: bash
        run: |
          echo "Verificando se o AKS 'aks-minecraft-server-prod' existe..."
          if az aks show --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod --query id -o tsv >/dev/null 2>&1; then
            echo "AKS encontrado. Infraestrutura ativa."
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "AKS nao encontrado! Forcando criacao da infraestrutura completa."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy infraestrutura
        if: steps.check-infra.outputs.active == 'false' || steps.filter.outputs.infra == 'true' || contains(github.event.head_commit.message, '[force-infra]')
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          confirm_token: "APPLY_INFRA"

  release:
    name: CI - Versao semantica
    needs: [deploy-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sincronizar tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release semantico
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
