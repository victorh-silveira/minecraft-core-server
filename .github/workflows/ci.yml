name: CI

on:
  push:
    branches: [main]

    paths:
      - ".github/**"
      - ".dockerignore"
      - ".env.example"
      - ".gitattributes"
      - ".gitignore"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"
      - "README.md"
      - "docs/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "tools/**"

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint
        uses: ./.github/actions/lint

  tests:
    name: Testes - Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testes
        uses: ./.github/actions/test

  security:
    name: Seguranca - Auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seguranca
        uses: ./.github/actions/security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker - Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        shell: bash
        run: |
          cat > .env << 'EOF'
          MINECRAFT_VERSION=1.20.6
          SERVER_TYPE=FABRIC
          MEMORY_LIMIT=2G
          EULA_ACCEPTED=TRUE
          GAME_PORT=25565
          RCON_PORT=25575
          ONLINE_MODE=false
          DIFFICULTY=hard
          MAX_PLAYERS=20
          RCON_PASSWORD=ci-test-password
          UID=1000
          GID=1000
          SKIP_CHOWN=false
          DOCKER_BASE_IMAGE=itzg/minecraft-server:latest
          IMAGE_VERSION=0.1.0
          DOCKER_PIDS_LIMIT=512
          MEMORY_RESERVATION=1G
          EOF
          docker compose --env-file .env config --quiet

  release:
    name: Release - Versao
    needs: [quality, tests, security, docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tags
        uses: ./.github/actions/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ./.github/actions/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
