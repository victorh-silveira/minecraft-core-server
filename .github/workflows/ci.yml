name: CI/CD - Pipeline principal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  workflow_dispatch:
    inputs:
      skip_cd:
        description: Apenas CI (sem release, deploy app ou pos-deploy)
        type: boolean
        default: false
      force_infra:
        description: Forcar terraform apply mesmo sem mudancas em infra/
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: CI - Python
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Python Lint e Validate
        uses: ./.github/actions/ci/lint-code

      - name: Python Testes
        uses: ./.github/actions/ci/test

      - name: Python Seguranca
        uses: ./.github/actions/ci/security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: CI - Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Terraform matriz
        uses: ./.github/actions/ci/validate-terraform

  docker:
    name: CI - Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Docker matriz
        uses: ./.github/actions/ci/validate-docker

  kubernetes:
    name: CI - Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Kubernetes matriz
        uses: ./.github/actions/ci/validate-kubernetes

  json:
    name: CI - JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: app/.python-version
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: JSON Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area json --stage lint

      - name: JSON Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area json --stage validate

  workflows:
    name: CI - Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Actionlint
        uses: ./.github/actions/ci/lint-infra

  deploy-infra:
    name: CD - Deploy Infra
    needs: [python, terraform, docker, kubernetes, json, workflows]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Detectar alteracoes na infraestrutura
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/terraform/**'

      - name: Autenticar no Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verificar se a infraestrutura esta ativa
        id: check-infra
        shell: bash
        run: |
          if az aks show --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod --query id -o tsv >/dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy infraestrutura
        id: deploy
        if: >-
          steps.check-infra.outputs.active == 'false' ||
          steps.filter.outputs.infra == 'true' ||
          github.event.inputs.force_infra == 'true' ||
          contains(github.event.head_commit.message, '[force-infra]')
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          confirm_token: "APPLY_INFRA"

  release:
    name: CI - Release
    needs: [python, terraform, docker, kubernetes, json, workflows, deploy-infra]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]') &&
      needs.python.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.kubernetes.result == 'success' &&
      needs.json.result == 'success' &&
      needs.workflows.result == 'success' &&
      needs.deploy-infra.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_cd != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    outputs:
      tag: ${{ steps.after_tag.outputs.tag }}
      published: ${{ steps.after_tag.outputs.published }}

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Capturar tag anterior
        id: before_tag
        shell: bash
        run: |
          git fetch --tags --force
          BEFORE="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${BEFORE}" >> "$GITHUB_OUTPUT"

      - name: Sincronizar tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release semantica
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capturar tag apos release
        id: after_tag
        shell: bash
        run: |
          git fetch origin main --tags --force
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before_tag.outputs.tag }}" != "$NEW" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-app:
    name: CD - Deploy App
    needs: [release]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]') &&
      needs.release.outputs.published == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_cd != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver whitelist
        id: whitelist
        uses: ./.github/actions/shared/resolve-whitelist
        with:
          whitelist: ${{ secrets.MINECRAFT_WHITELIST }}

      - name: Deploy aplicacao
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ needs.release.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}
          minecraft_whitelist: ${{ steps.whitelist.outputs.resolved }}

  post-deploy:
    name: CD - Pos-deploy
    needs: [deploy-app]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Autenticar no Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Credenciais AKS
        uses: ./.github/actions/shared/aks-context

      - name: Testes pos-deploy
        uses: ./.github/actions/cd/post-deploy

  pipeline-summary:
    name: CI/CD - Resumo
    needs: [python, terraform, docker, kubernetes, json, workflows, deploy-infra, release, deploy-app, post-deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Resumo do pipeline
        uses: ./.github/actions/shared/pipeline-summary
        with:
          python: ${{ needs.python.result }}
          terraform: ${{ needs.terraform.result }}
          docker: ${{ needs.docker.result }}
          kubernetes: ${{ needs.kubernetes.result }}
          json: ${{ needs.json.result }}
          workflows: ${{ needs.workflows.result }}
          deploy_infra: ${{ needs.deploy-infra.result }}
          release: ${{ needs.release.result }}
          deploy_app: ${{ needs.deploy-app.result }}
          post_deploy: ${{ needs.post-deploy.result }}
          release_tag: ${{ needs.release.outputs.tag }}
          release_published: ${{ needs.release.outputs.published }}
