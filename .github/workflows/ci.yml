name: CI/CD - Pipeline principal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  workflow_dispatch:
    inputs:
      skip_cd:
        description: Apenas CI (sem release, deploy app ou pos-deploy)
        type: boolean
        default: false
      force_infra:
        description: Forcar terraform apply mesmo sem mudancas em infra/
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: CI - Python
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Instalar Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Python | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage lint

      - name: Python | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage security

      - name: Python | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 100

      - name: Python | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage validate

      - name: Python | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area python --stage build

  docker:
    name: CI - Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Instalar Hadolint
        shell: bash
        run: |
          curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0

      - name: Docker | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage lint

      - name: Docker | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage security

      - name: Docker | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage test

      - name: Docker | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage validate

      - name: Docker | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area docker --stage build

  kubernetes:
    name: CI - Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0

      - name: Kubernetes | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage lint

      - name: Kubernetes | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage security

      - name: Kubernetes | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage test

      - name: Kubernetes | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage validate

      - name: Kubernetes | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage build

  terraform:
    name: CI - Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - name: Configurar TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Instalar tfsec
        shell: bash
        run: |
          curl -fsSL -o /tmp/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x /tmp/tfsec
          sudo mv /tmp/tfsec /usr/local/bin/tfsec

      - name: Terraform | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area terraform --stage lint

      - name: Terraform | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area terraform --stage security

      - name: Terraform | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area terraform --stage test

      - name: Terraform | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area terraform --stage validate

      - name: Terraform | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area terraform --stage build

  github:
    name: CI - GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: GitHub | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area github --stage lint

      - name: GitHub | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area github --stage security

      - name: GitHub | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area github --stage test

      - name: GitHub | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area github --stage validate

      - name: GitHub | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area github --stage build

  scripts:
    name: CI - Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/ci/setup-python

      - name: Scripts | Lint
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area scripts --stage lint

      - name: Scripts | Seguranca
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area scripts --stage security

      - name: Scripts | Testes
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area scripts --stage test

      - name: Scripts | Validate
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area scripts --stage validate

      - name: Scripts | Build
        shell: bash
        run: python app/scripts/operations/clean_workspace.py --area scripts --stage build

  deploy-infra:
    name: CD - Deploy Infra
    needs: [python, docker, kubernetes, terraform, github, scripts]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Infra | Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/terraform/**'

      - name: Infra | Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infra | Status
        id: check-infra
        shell: bash
        run: |
          if az aks show --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod --query id -o tsv >/dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Infra | Apply
        id: deploy
        if: >-
          steps.check-infra.outputs.active == 'false' ||
          steps.filter.outputs.infra == 'true' ||
          github.event.inputs.force_infra == 'true' ||
          contains(github.event.head_commit.message, '[force-infra]')
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          confirm_token: "APPLY_INFRA"

  release:
    name: CI - Release
    needs: [python, docker, kubernetes, terraform, github, scripts, deploy-infra]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]') &&
      needs.python.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.kubernetes.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.github.result == 'success' &&
      needs.scripts.result == 'success' &&
      needs.deploy-infra.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_cd != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    outputs:
      tag: ${{ steps.after_tag.outputs.tag }}
      published: ${{ steps.after_tag.outputs.published }}

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release | Baseline
        id: before_tag
        shell: bash
        run: |
          git fetch --tags --force
          BEFORE="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${BEFORE}" >> "$GITHUB_OUTPUT"

      - name: Release | Tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release | Semantic
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release | Resultado
        id: after_tag
        shell: bash
        run: |
          git fetch origin main --tags --force
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo __none__)"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before_tag.outputs.tag }}" != "$NEW" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-app:
    name: CD - Deploy App
    needs: [release]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip-cd]') &&
      needs.release.outputs.published == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_cd != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: App | Whitelist
        id: whitelist
        uses: ./.github/actions/shared/resolve-whitelist
        with:
          whitelist: ${{ secrets.MINECRAFT_WHITELIST }}

      - name: App | Deploy
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ needs.release.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}
          minecraft_whitelist: ${{ steps.whitelist.outputs.resolved }}

  post-deploy:
    name: CD - Pos-deploy
    needs: [deploy-app]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Pos-deploy | Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pos-deploy | AKS
        uses: ./.github/actions/shared/aks-context

      - name: Pos-deploy | Testes
        uses: ./.github/actions/cd/post-deploy

  pipeline-summary:
    name: CI - Resumo
    needs: [python, docker, kubernetes, terraform, github, scripts, deploy-infra, release, deploy-app, post-deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Resumo | Pipeline
        uses: ./.github/actions/shared/pipeline-summary
        with:
          python: ${{ needs.python.result }}
          docker: ${{ needs.docker.result }}
          kubernetes: ${{ needs.kubernetes.result }}
          terraform: ${{ needs.terraform.result }}
          github: ${{ needs.github.result }}
          scripts: ${{ needs.scripts.result }}
          deploy_infra: ${{ needs.deploy-infra.result }}
          release: ${{ needs.release.result }}
          deploy_app: ${{ needs.deploy-app.result }}
          post_deploy: ${{ needs.post-deploy.result }}
          release_tag: ${{ needs.release.outputs.tag }}
          release_published: ${{ needs.release.outputs.published }}
