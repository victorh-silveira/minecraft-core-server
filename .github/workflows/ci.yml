name: CI

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - "app/**"
      - "docs/**"
      - "infra/**"
      - "linters/**"
      - "Makefile"
      - "README.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: CI - Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint codigo
        uses: ./.github/actions/ci/lint-code

      - name: Lint infra
        uses: ./.github/actions/ci/lint-infra

  validate:
    name: CI - Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testes
        uses: ./.github/actions/ci/test

      - name: Seguranca
        uses: ./.github/actions/ci/security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar Docker
        uses: ./.github/actions/ci/validate-docker

      - name: Validar Kubernetes
        uses: ./.github/actions/ci/validate-kubernetes

      - name: Validar Terraform
        uses: ./.github/actions/ci/validate-terraform

  release:
    name: CI - Release
    needs: [linter, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync tags
        uses: ./.github/actions/ci/sync-tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release semantico
        uses: ./.github/actions/ci/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
