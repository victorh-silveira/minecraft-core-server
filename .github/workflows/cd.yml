name: CD

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag da imagem (ex. v1.0.0). Nao use latest.
        required: true

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: CD - Deploy App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir tag da imagem
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.image_tag }}"
          fi
          if [ "$TAG" = "latest" ]; then
            echo "Tag 'latest' nao e permitida. Use uma tag semantica (ex. v1.0.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy aplicacao
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ steps.image.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}

  post-deploy:
    name: CD - Post Deploy
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Credenciais AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-minecraft-prod-bs
          cluster-name: aks-minecraft-prod

      - name: Testes pos-deploy
        uses: ./.github/actions/cd/post-deploy
