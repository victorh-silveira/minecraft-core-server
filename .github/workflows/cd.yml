name: CD

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execucao
        required: true
        type: choice
        options:
          - deploy-app
          - deploy-infra
      image_tag:
        description: Tag da imagem (deploy-app). Nao use latest.
        required: false
        type: string
      confirm_infra:
        description: Digite APPLY_INFRA (deploy-infra)
        required: false
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infra:
    name: CD - Deploy Infra
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy infraestrutura
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          confirm_token: ${{ inputs.confirm_infra }}

  deploy-app:
    name: CD - Deploy App
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-app')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir tag da imagem
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Informe image_tag para deploy-app manual."
            exit 1
          fi
          if [ "$TAG" = "latest" ]; then
            echo "Tag 'latest' nao e permitida. Use uma tag semantica (ex. v1.0.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy aplicacao
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ steps.image.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}

  post-deploy:
    name: CD - Post Deploy
    needs: [deploy-app]
    if: always() && needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Credenciais AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-minecraft-server-prod
          cluster-name: aks-minecraft-server-prod

      - name: Testes pos-deploy
        uses: ./.github/actions/cd/post-deploy
