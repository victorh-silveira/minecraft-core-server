name: CD - Entrega manual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execucao
        required: true
        type: choice
        options:
          - deploy-app
          - deploy-infra
          - deploy-app-and-verify
      image_tag:
        description: Tag da imagem (deploy-app). Nao use latest.
        required: false
        type: string
      confirm_infra:
        description: Digite APPLY_INFRA (deploy-infra)
        required: false
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infra:
    name: CD - Deploy Infra
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-infra'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-infra

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Infra | Apply
        uses: ./.github/actions/cd/deploy-infra
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          confirm_token: ${{ inputs.confirm_infra }}

  deploy-app:
    name: CD - Deploy App
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy-app' || inputs.mode == 'deploy-app-and-verify'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: App | Tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.image_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Informe image_tag para deploy-app manual."
            exit 1
          fi
          if [ "$TAG" = "latest" ]; then
            echo "Tag 'latest' nao e permitida. Use uma tag semantica (ex. v1.0.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: App | Whitelist
        id: whitelist
        uses: ./.github/actions/shared/resolve-whitelist
        with:
          whitelist: ${{ secrets.MINECRAFT_WHITELIST }}

      - name: App | Deploy
        uses: ./.github/actions/cd/deploy-app
        with:
          image_tag: ${{ steps.image.outputs.tag }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          rcon_password: ${{ secrets.RCON_PASSWORD }}
          minecraft_whitelist: ${{ steps.whitelist.outputs.resolved }}

  post-deploy:
    name: CD - Pos-deploy
    needs: [deploy-app]
    if: always() && needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Obter codigo fonte
        uses: actions/checkout@v4

      - name: Pos-deploy | Azure
        uses: ./.github/actions/shared/azure-login
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pos-deploy | AKS
        uses: ./.github/actions/shared/aks-context

      - name: Pos-deploy | Testes
        uses: ./.github/actions/cd/post-deploy
