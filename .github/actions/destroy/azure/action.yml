name: Destroy - Remocao Azure
description: Plano e execucao de destroy Terraform da stack live/prod

inputs:
  azure_client_id:
    description: ID do cliente do app registration Azure (OIDC)
    required: false
    default: ""
  azure_tenant_id:
    description: ID do locatario Azure
    required: true
  azure_subscription_id:
    description: ID da assinatura Azure
    required: true
  azure_credentials:
    description: JSON do service principal (fallback se OIDC nao configurado)
    required: false
    default: ""
  confirm_token:
    description: Token de confirmacao (deve ser DESTROY)
    required: true

runs:
  using: composite

  steps:
    - name: Validar confirmacao
      shell: bash
      run: |
        if [ "${{ inputs.confirm_token }}" != "DESTROY" ]; then
          echo "Confirmacao invalida. Informe DESTROY no campo confirm."
          exit 1
        fi

    - name: Autenticar no Azure
      uses: ./.github/actions/shared/azure-login
      with:
        azure_client_id: ${{ inputs.azure_client_id }}
        azure_tenant_id: ${{ inputs.azure_tenant_id }}
        azure_subscription_id: ${{ inputs.azure_subscription_id }}
        azure_credentials: ${{ inputs.azure_credentials }}

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.4"
        terraform_wrapper: false

    - name: Preparar terraform.tfvars
      shell: bash
      run: |
        {
          echo "subscription_id = \"${{ inputs.azure_subscription_id }}\""
          echo "tenant_id = \"${{ inputs.azure_tenant_id }}\""
        } > infra/terraform/live/prod/terraform.tfvars

    - name: Limpar recursos Kubernetes no AKS
      shell: bash
      run: |
        echo "Obtendo credenciais do AKS para limpeza de recursos..."
        if az aks get-credentials --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod --overwrite-existing 2>/dev/null; then
          echo "Conectado com sucesso ao AKS. Removendo a namespace minecraft-server-prod para liberar LoadBalancers e PVCs..."
          kubectl delete namespace minecraft-server-prod --ignore-not-found=true --timeout=180s || true
        else
          echo "AKS nao encontrado ou indisponivel. Continuando com o destroy direto..."
        fi

    - name: Remover cluster AKS
      shell: bash
      run: |
        if az aks show --resource-group rg-minecraft-server-prod --name aks-minecraft-server-prod >/dev/null 2>&1; then
          echo "Deletando cluster AKS (libera subnet e NICs dos nodes)..."
          az aks delete \
            --resource-group rg-minecraft-server-prod \
            --name aks-minecraft-server-prod \
            --yes
        else
          echo "Cluster AKS ja removido."
        fi
        if az group exists --name rg-minecraft-server-nodes-prod 2>/dev/null | grep -qi true; then
          echo "Removendo resource group de nodes..."
          az group delete --name rg-minecraft-server-nodes-prod --yes --no-wait
        fi

    - name: Plano de destroy Terraform
      id: tf_plan
      shell: bash
      env:
        ARM_USE_OIDC: true
        ARM_USE_AZUREAD: true
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: |
        if ! az group show --name rg-minecraft-server-prod >/dev/null 2>&1; then
          echo "Resource group principal ausente. Pulando plano Terraform."
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skipped=false" >> "$GITHUB_OUTPUT"
        cd infra/terraform/live/prod
        terraform init -input=false
        set +e
        plan_out="$(terraform plan -destroy -input=false -no-color -out=destroy.tfplan 2>&1)"
        plan_rc=$?
        set -e
        if [ "$plan_rc" -ne 0 ]; then
          lock_id="$(printf '%s' "$plan_out" | awk '/^  ID:/{print $2; exit}')"
          if [ -n "$lock_id" ]; then
            echo "Lock stale detectado (${lock_id}). Liberando..."
            terraform force-unlock -force "$lock_id"
            terraform plan -destroy -input=false -no-color -out=destroy.tfplan
          else
            printf '%s\n' "$plan_out"
            exit "$plan_rc"
          fi
        fi
        terraform show -no-color destroy.tfplan > destroy-plan.txt

    - name: Publicar artefato do plano de destroy
      if: steps.tf_plan.outputs.skipped != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-destroy-plan-${{ github.run_id }}
        path: infra/terraform/live/prod/destroy-plan.txt
        retention-days: 14

    - name: Executar destroy Terraform
      if: steps.tf_plan.outputs.skipped != 'true'
      shell: bash
      env:
        ARM_USE_OIDC: true
        ARM_USE_AZUREAD: true
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: |
        cd infra/terraform/live/prod
        terraform apply -input=false -auto-approve destroy.tfplan

    - name: Remover resource groups e storage restantes
      shell: bash
      run: bash app/scripts/bash/teardown-azure-stack.sh
