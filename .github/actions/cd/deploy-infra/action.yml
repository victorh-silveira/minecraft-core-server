name: CD - Deploy da infraestrutura
description: Aplicacao Terraform (apply) na stack live/prod

inputs:
  azure_client_id:
    description: ID do cliente do app registration Azure (OIDC)
    required: true
  azure_tenant_id:
    description: ID do locatario Azure
    required: true
  azure_subscription_id:
    description: ID da assinatura Azure
    required: true
  confirm_token:
    description: Deve ser APPLY_INFRA para confirmar a aplicacao
    required: true

runs:
  using: composite

  steps:
    - name: Validar confirmacao
      shell: bash
      run: |
        if [ "${{ inputs.confirm_token }}" != "APPLY_INFRA" ]; then
          echo "Confirmacao invalida. Informe APPLY_INFRA."
          exit 1
        fi

    - name: Autenticar no Azure
      uses: ./.github/actions/shared/azure-login
      with:
        azure_client_id: ${{ inputs.azure_client_id }}
        azure_tenant_id: ${{ inputs.azure_tenant_id }}
        azure_subscription_id: ${{ inputs.azure_subscription_id }}

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.4"
        terraform_wrapper: false

    - name: Preparar terraform.tfvars
      shell: bash
      run: |
        {
          echo "subscription_id = \"${{ inputs.azure_subscription_id }}\""
          echo "tenant_id = \"${{ inputs.azure_tenant_id }}\""
        } > infra/terraform/live/prod/terraform.tfvars

    - name: Provisionar backend do Terraform
      shell: bash
      run: bash app/scripts/bash/ensure-tfstate-backend.sh

    - name: Aplicar Terraform
      shell: bash
      env:
        ARM_USE_OIDC: true
        ARM_USE_AZUREAD: true
        ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
        ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      run: |
        cd infra/terraform/live/prod
        terraform init -input=false
        terraform apply -auto-approve -input=false
