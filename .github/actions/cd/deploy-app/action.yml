name: CD - Deploy da aplicacao
description: Construcao da imagem, publicacao no ACR e rollout no Kubernetes

inputs:
  image_tag:
    description: Tag da imagem no ACR
    required: true
  azure_client_id:
    description: ID do cliente do app registration Azure (OIDC)
    required: false
    default: ""
  azure_tenant_id:
    description: ID do locatario Azure
    required: true
  azure_subscription_id:
    description: ID da assinatura Azure
    required: true
  azure_credentials:
    description: JSON do service principal (fallback se OIDC nao configurado)
    required: false
    default: ""
  rcon_password:
    description: Senha RCON (GitHub Secret RCON_PASSWORD)
    required: true
  minecraft_whitelist:
    description: Nicks permitidos separados por virgula (GitHub Secret MINECRAFT_WHITELIST)
    required: true
  resource_group:
    description: Nome do grupo de recursos Azure
    required: false
    default: rg-minecraft-server-prod
  aks_cluster_name:
    description: Nome do cluster AKS
    required: false
    default: aks-minecraft-server-prod
  acr_name:
    description: Nome do Azure Container Registry
    required: false
    default: acrminecraftserverprod

runs:
  using: composite

  steps:
    - name: Autenticar no Azure
      uses: ./.github/actions/shared/azure-login
      with:
        azure_client_id: ${{ inputs.azure_client_id }}
        azure_tenant_id: ${{ inputs.azure_tenant_id }}
        azure_subscription_id: ${{ inputs.azure_subscription_id }}
        azure_credentials: ${{ inputs.azure_credentials }}

    - name: Credenciais AKS
      uses: ./.github/actions/shared/aks-context
      with:
        resource-group: ${{ inputs.resource_group }}
        cluster-name: ${{ inputs.aks_cluster_name }}

    - name: Autenticar no ACR
      shell: bash
      run: az acr login --name ${{ inputs.acr_name }}

    - name: Definir imagem
      id: image
      shell: bash
      run: |
        ACR_LOGIN=$(az acr show --name ${{ inputs.acr_name }} --query loginServer -o tsv)
        IMAGE="${ACR_LOGIN}/minecraft-core-server:${{ inputs.image_tag }}"
        echo "ref=${IMAGE}" >> "$GITHUB_OUTPUT"
        echo "Imagem: ${IMAGE}"

    - name: Marcar inicio da build
      shell: bash
      run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir e publicar imagem
      id: docker-build
      uses: docker/build-push-action@v6
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: infra/docker/Dockerfile
        push: true
        tags: ${{ steps.image.outputs.ref }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Aplicar namespace
      shell: bash
      run: kubectl apply -f infra/kubernetes/base/namespace.yaml

    - name: Secret de RCON
      shell: bash
      run: |
        kubectl -n minecraft-server-prod create secret generic mc-rcon \
          --from-literal=RCON_PASSWORD="${{ inputs.rcon_password }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Secret de acesso
      shell: bash
      run: |
        kubectl -n minecraft-server-prod create secret generic mc-access \
          --from-literal=WHITELIST="${{ inputs.minecraft_whitelist }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Aplicar manifests Kubernetes
      shell: bash
      run: |
        IMAGE="${{ steps.image.outputs.ref }}"
        BACKUP_CLIENT_ID=$(az identity show \
          --resource-group ${{ inputs.resource_group }} \
          --name id-mc-world-backup-prod \
          --query clientId -o tsv 2>/dev/null || true)
        MANIFEST=$(kubectl kustomize infra/kubernetes/overlays/prod \
          | sed "s|acrminecraftserverprod.azurecr.io/minecraft-core-server:placeholder|${IMAGE}|g")
        if [ -n "${BACKUP_CLIENT_ID}" ]; then
          MANIFEST=$(printf '%s' "${MANIFEST}" \
            | sed "s|BACKUP_AZURE_CLIENT_ID_PLACEHOLDER|${BACKUP_CLIENT_ID}|g")
        fi
        printf '%s' "${MANIFEST}" | kubectl apply -f -
        kubectl -n minecraft-server-prod delete pod mc-server-0 --ignore-not-found --wait=false
        kubectl -n minecraft-server-prod rollout status statefulset/mc-server --timeout=1200s

    - name: Publicar resumo do deploy
      if: always()
      shell: bash
      run: |
        END=$(date +%s)
        START="${BUILD_STARTED_AT:-$END}"
        DURATION=$((END - START))
        IMAGE="${{ steps.image.outputs.ref }}"
        DIGEST="${{ steps.docker-build.outputs.digest }}"
        {
          echo "## Resumo - Deploy da aplicacao"
          echo ""
          echo "### Build Docker"
          echo ""
          echo "Para analisar a build em detalhe, baixe o arquivo de registro (.dockerbuild) na secao **Artefatos** deste job e importe no Builds do Docker Desktop."
          echo ""
          echo "Os registros incluem tempo, dependencias, resultados, logs, traces e outras informacoes. [Documentacao](https://docs.docker.com/build/ci/github-actions/build-summary/)"
          echo ""
          echo "| Campo | Valor |"
          echo "|-------|-------|"
          echo "| Nome | minecraft-server/infra/docker |"
          echo "| Status | concluido |"
          echo "| Duracao | ${DURATION}s |"
          echo "| Imagem | \`${IMAGE}\` |"
          if [ -n "${DIGEST}" ]; then
            echo "| Digest | \`${DIGEST}\` |"
          fi
          echo ""
          echo "**Entradas da build**"
          echo ""
          echo "- Contexto: \`.\`"
          echo "- Dockerfile: \`infra/docker/Dockerfile\`"
          echo "- Push: \`true\`"
          echo "- Cache: \`type=gha\`"
          echo ""
          echo "### Kubernetes"
          echo ""
          if [ "${{ job.status }}" = "success" ]; then
            echo "Rollout do StatefulSet \`mc-server\` concluido no namespace \`minecraft-server-prod\`."
          else
            echo "Deploy interrompido ou com falha antes da conclusao do rollout."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
