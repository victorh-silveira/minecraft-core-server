name: CI - Validar Kubernetes
description: Validacao dos manifestos Kubernetes (kubeconform) no overlay de producao

runs:
  using: composite

  steps:
    - name: Instalar kubeconform
      shell: bash
      run: |
        curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
        sudo mv kubeconform /usr/local/bin/kubeconform

    - name: Validar manifestos
      shell: bash
      run: |
        kubectl kustomize infra/kubernetes/overlays/prod | kubeconform -kubernetes-version 1.34.0 -summary -ignore-missing-schemas

    - name: Publicar annotations no resumo do workflow
      shell: bash
      run: bash app/scripts/bash/publicar-annotations-github.sh static
