name: CI - Kubernetes
description: Matriz crash-first Kubernetes via orquestrador

runs:
  using: composite

  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version-file: app/.python-version
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt

    - name: Instalar dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt -r app/requirements-dev.txt

    - name: Instalar Trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        version: v0.74.0

    - name: Kubernetes | Lint
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage lint

    - name: Kubernetes | Seguranca
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage security

    - name: Kubernetes | Testes
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage test

    - name: Kubernetes | Validate
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage validate

    - name: Kubernetes | Build
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area kubernetes --stage build
