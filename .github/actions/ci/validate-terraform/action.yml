name: CI - Terraform
description: Matriz crash-first Terraform via orquestrador

runs:
  using: composite

  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version-file: app/.python-version
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt

    - name: Instalar dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt -r app/requirements-dev.txt

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.4"
        terraform_wrapper: false

    - name: Configurar TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.54.0

    - name: Instalar tfsec
      shell: bash
      run: |
        curl -fsSL -o /tmp/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
        chmod +x /tmp/tfsec
        sudo mv /tmp/tfsec /usr/local/bin/tfsec

    - name: Terraform | Lint
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area terraform --stage lint

    - name: Terraform | Seguranca
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area terraform --stage security

    - name: Terraform | Testes
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area terraform --stage test

    - name: Terraform | Validate
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area terraform --stage validate

    - name: Terraform | Build
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area terraform --stage build
