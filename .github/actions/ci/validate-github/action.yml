name: CI - GitHub
description: Matriz crash-first GitHub Actions via orquestrador

runs:
  using: composite

  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version-file: app/.python-version
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/requirements-dev.txt

    - name: Instalar dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt -r app/requirements-dev.txt

    - name: Marcar inicio da matriz
      shell: bash
      run: echo "SUMMARY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: GitHub | Lint
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area github --stage lint

    - name: GitHub | Seguranca
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area github --stage security

    - name: GitHub | Testes
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area github --stage test

    - name: GitHub | Validate
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area github --stage validate

    - name: GitHub | Build
      shell: bash
      run: python app/scripts/operations/clean_workspace.py --area github --stage build

    - name: Publicar resumo
      if: always()
      uses: ./.github/actions/shared/area-summary
      with:
        title: CI - GitHub
        area: github
        details: |-
          - Parse YAML de workflows e hooks
          - Sem credencial estatica
          - Jobs da matriz CI presentes
          - actionlint + composite actions locais
