name: Lint Python
description: Ruff, Vulture, Pylint e limite de linhas — alinhado a pyproject.toml

runs:
  using: composite

  steps:
    - name: Configurar Python (.python-version)
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip

    - name: Instalar dependencias (runtime e dev)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Clean workspace — lint
      shell: bash
      run: python scripts/python/clean_workspace.py --stage lint
