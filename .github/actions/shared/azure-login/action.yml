name: Autenticacao Azure
description: Autentica via OIDC (preferencial) ou service principal JSON (legado)

inputs:
  azure_client_id:
    description: ID do cliente do app registration (OIDC)
    required: false
    default: ""
  azure_tenant_id:
    description: ID do locatario Azure
    required: true
  azure_subscription_id:
    description: ID da assinatura Azure
    required: true
  azure_credentials:
    description: JSON do service principal (fallback se OIDC nao configurado)
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Autenticar via OIDC
      if: inputs.azure_client_id != ''
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Autenticar via service principal
      if: inputs.azure_client_id == ''
      uses: azure/login@v2
      with:
        creds: ${{ inputs.azure_credentials }}

    - name: Exportar credenciais ARM para Terraform (OIDC)
      if: inputs.azure_client_id != ''
      shell: bash
      run: |
        echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"
        echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"
        echo "ARM_CLIENT_ID=${{ inputs.azure_client_id }}" >> "$GITHUB_ENV"
        echo "ARM_TENANT_ID=${{ inputs.azure_tenant_id }}" >> "$GITHUB_ENV"
        echo "ARM_SUBSCRIPTION_ID=${{ inputs.azure_subscription_id }}" >> "$GITHUB_ENV"
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "ARM_OIDC_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" >> "$GITHUB_ENV"
        fi
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "ARM_OIDC_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL}" >> "$GITHUB_ENV"
        fi
