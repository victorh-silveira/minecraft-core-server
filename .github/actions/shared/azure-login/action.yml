name: Azure Login
description: Autentica via OIDC (preferencial) ou service principal JSON (legado)

inputs:
  azure_client_id:
    description: Client ID do app registration (OIDC)
    required: false
    default: ""
  azure_tenant_id:
    description: Azure tenant ID
    required: true
  azure_subscription_id:
    description: Azure subscription ID
    required: true
  azure_credentials:
    description: JSON do service principal (fallback se OIDC nao configurado)
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Login OIDC
      if: inputs.azure_client_id != ''
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Login service principal
      if: inputs.azure_client_id == ''
      uses: azure/login@v2
      with:
        creds: ${{ inputs.azure_credentials }}
