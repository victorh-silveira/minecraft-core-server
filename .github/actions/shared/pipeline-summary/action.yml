name: Resumo do pipeline
description: Publica status dos jobs no GitHub Summary

inputs:
  linter:
    required: true
  validate:
    required: true
  deploy_infra:
    required: true
  release:
    required: true
  deploy_app:
    required: true
  post_deploy:
    required: true
  release_tag:
    required: false
    default: ""
  release_published:
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Publicar resumo
      shell: bash
      run: |
        {
          echo "## Resumo CI/CD"
          echo ""
          echo "| Etapa | Status |"
          echo "|-------|--------|"
          echo "| Linter | ${{ inputs.linter }} |"
          echo "| Validacao | ${{ inputs.validate }} |"
          echo "| Deploy infra | ${{ inputs.deploy_infra }} |"
          echo "| Release | ${{ inputs.release }} |"
          echo "| Deploy app | ${{ inputs.deploy_app }} |"
          echo "| Pos-deploy | ${{ inputs.post_deploy }} |"
          echo ""
          if [ "${{ inputs.release_published }}" = "true" ]; then
            echo "Tag publicada: \`${{ inputs.release_tag }}\`"
          else
            echo "Nenhuma tag nova neste push."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
