name: Resolver whitelist Minecraft
description: Converte nicks para UUID offline quando necessario

inputs:
  whitelist:
    description: Nicks ou UUIDs separados por virgula
    required: true
  fallback_nick:
    description: Nick padrao se whitelist vazia
    required: false
    default: AnonymousNoobz

outputs:
  resolved:
    description: Lista de UUIDs para o secret mc-access
    value: ${{ steps.resolve.outputs.resolved }}

runs:
  using: composite

  steps:
    - name: Resolver whitelist
      id: resolve
      shell: bash
      run: |
        NICKS="${{ inputs.whitelist }}"
        if [ -z "${NICKS}" ]; then
          NICKS="${{ inputs.fallback_nick }}"
        fi
        RESOLVED="$(bash app/scripts/bash/resolve-whitelist.sh "${NICKS}")"
        echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"
