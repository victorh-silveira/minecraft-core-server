# ---- METADADOS DO PROJETO ----
[project]
name = "minecraft-server"
version = "0.0.0"
description = "Servidor Minecraft Fabric com Docker Compose e sincronizacao de mods via manifesto."
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "requests>=2.31.0",
]

# ---- DEPENDENCIAS OPCIONAIS DE DESENVOLVIMENTO ----
[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.14.0",
    "interrogate>=1.7.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pylint>=3.0.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.13",
    "vulture>=2.16",
]

# ---- RUFF: LINT E FORMATACAO ----
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "src/domain/world-data",
    "src/infrastructure/logging",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "S",
    "BLE",
    "A",
    "COM",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "COM812",
    "ISC001",
    "BLE001",
    "S105",
]

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"scripts/python/**/*.py" = ["T201", "S603", "S607", "S101"]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---- PYTEST: TESTES UNITARIOS ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts/python"]
addopts = "-q --strict-markers"

# ---- INTERROGATE: COBERTURA DE DOCSTRINGS ----
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "scripts",
    "tests",
    "venv",
]

# ---- BANDIT: ANALISE DE SEGURANCA ----
[tool.bandit]
skips = ["B105", "B106", "B404", "B603"]
exclude_dirs = [".git", ".venv", "tests", "venv", "src/domain/world-data"]
exclude = ["*/clean_workspace.py"]

# ---- COVERAGE: COBERTURA DE TESTES ----
[tool.coverage.run]
source = ["scripts/python"]
omit = ["scripts/python/clean_workspace.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---- VULTURE: DEAD CODE ----
[tool.vulture]
min_confidence = 70
paths = ["scripts/python"]
exclude = ["scripts/python/clean_workspace.py"]
