apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mc-world-backup
  namespace: minecraft-server-prod
  labels:
    app.kubernetes.io/name: mc-world-backup
    app.kubernetes.io/component: backup-mundo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mc-world-backup
  namespace: minecraft-server-prod
  labels:
    app.kubernetes.io/name: mc-world-backup
    app.kubernetes.io/component: backup-mundo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mc-world-backup
subjects:
  - kind: ServiceAccount
    name: mc-world-backup
    namespace: minecraft-server-prod
