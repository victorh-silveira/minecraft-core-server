apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-server
  namespace: mc-prod
  labels:
    app.kubernetes.io/name: mc-server
spec:
  serviceName: mc-server-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-server
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-data-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/world /data/mods /data/plugins /data/logs /data/database
          volumeMounts:
            - name: mc-data
              mountPath: /data
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      containers:
        - name: mc-server
          image: acrminecraftprod.azurecr.io/minecraft-core-server:placeholder
          imagePullPolicy: Always
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: "1.20.6"
            - name: TYPE
              value: "FABRIC"
            - name: MEMORY
              value: "2G"
            - name: ONLINE_MODE
              value: "false"
            - name: DIFFICULTY
              value: "hard"
            - name: MAX_PLAYERS
              value: "20"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mc-rcon
                  key: RCON_PASSWORD
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: SYNC_CHUNK_WRITES
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: mc-data
              mountPath: /data/world
              subPath: world
            - name: mc-data
              mountPath: /data/mods
              subPath: mods
            - name: mc-data
              mountPath: /data/plugins
              subPath: plugins
            - name: mc-data
              mountPath: /data/logs
              subPath: logs
            - name: mc-data
              mountPath: /data/database
              subPath: database
      volumes:
        - name: mc-data
          persistentVolumeClaim:
            claimName: mc-data
