apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-server
  namespace: minecraft-server-prod
  labels:
    app.kubernetes.io/name: mc-server
    app.kubernetes.io/component: servidor-jogo
spec:
  serviceName: mc-server-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-server
        app.kubernetes.io/component: servidor-jogo
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-data-dirs
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - mkdir -p /data/world /data/mods /data/plugins /data/logs /data/database && cp /config/server.properties /data/server.properties
          volumeMounts:
            - name: mc-data
              mountPath: /data
            - name: server-properties
              mountPath: /config
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      containers:
        - name: mc-server
          image: ghcr.io/victorh-silveira/minecraft-core-server:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: "26.3"
            - name: TYPE
              value: "FORGE"
            - name: FORGE_VERSION
              value: "66.0.6"
            - name: INIT_MEMORY
              value: "1G"
            - name: MAX_MEMORY
              value: "2G"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: WHITE_LIST
              value: "FALSE"
            - name: ENFORCE_WHITELIST
              value: "FALSE"
            - name: ENFORCE_SECURE_PROFILE
              value: "FALSE"
            - name: DIFFICULTY
              value: "hard"
            - name: MAX_PLAYERS
              value: "20"
            - name: MOTD
              value: |-
                §a§lMinecraft Core Server§r
                §7Forge 26.3 §8• §eSurvival §8• §bKeepInventory
            - name: ICON
              value: "/templates/server-icon.png"
            - name: OVERRIDE_ICON
              value: "true"
            - name: ENABLE_COMMAND_BLOCK
              value: "TRUE"
            - name: OP_PERMISSION_LEVEL
              value: "4"
            - name: FUNCTION_PERMISSION_LEVEL
              value: "4"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_CMDS_STARTUP
              value: |-
                gamerule keep_inventory true
                gamerule players_sleeping_percentage 1
                gamerule command_block_output false
                gamerule send_command_feedback false
            - name: RCON_CMDS_ON_CONNECT
              value: "op AnonymousNoobz"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mc-rcon
                  key: RCON_PASSWORD
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: SYNC_CHUNK_WRITES
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mc-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: server-properties
          configMap:
            name: mc-server-properties
        - name: mc-data
          persistentVolumeClaim:
            claimName: mc-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
