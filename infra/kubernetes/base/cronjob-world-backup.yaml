apiVersion: batch/v1
kind: CronJob
metadata:
  name: mc-world-backup
  namespace: minecraft-server-prod
  labels:
    app.kubernetes.io/name: mc-world-backup
    app.kubernetes.io/component: backup-mundo
spec:
  schedule: "0 3 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mc-world-backup
            app.kubernetes.io/component: backup-mundo
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: mc-world-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: mcr.microsoft.com/azure-cli:cbl-mariner2.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: mc-world-backup
              command:
                - /bin/bash
                - -ec
                - |
                  curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
                  chmod +x /tmp/kubectl
                  export PATH="/tmp:${PATH}"
                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  REMOTE_ARCHIVE="/tmp/world-${STAMP}.tar.gz"
                  LOCAL_ARCHIVE="/tmp/world-${STAMP}.tar.gz"
                  BLOB_NAME="world-${STAMP}.tar.gz"
                  kubectl -n "${TARGET_NAMESPACE}" exec "${TARGET_POD}" -c "${TARGET_CONTAINER}" -- \
                    tar czf "${REMOTE_ARCHIVE}" -C /data world
                  kubectl -n "${TARGET_NAMESPACE}" cp \
                    "${TARGET_NAMESPACE}/${TARGET_POD}:${REMOTE_ARCHIVE}" \
                    "${LOCAL_ARCHIVE}" -c "${TARGET_CONTAINER}"
                  kubectl -n "${TARGET_NAMESPACE}" exec "${TARGET_POD}" -c "${TARGET_CONTAINER}" -- \
                    rm -f "${REMOTE_ARCHIVE}"
                  az storage blob upload \
                    --account-name "${AZURE_STORAGE_ACCOUNT}" \
                    --container-name "${AZURE_STORAGE_CONTAINER}" \
                    --name "${BLOB_NAME}" \
                    --file "${LOCAL_ARCHIVE}" \
                    --auth-mode login \
                    --overwrite false
                  rm -f "${LOCAL_ARCHIVE}"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
