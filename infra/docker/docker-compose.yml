# ---- ORQUESTRADOR DO SERVIDOR MINECRAFT (DOCKER COMPOSE) ----
name: minecraft-core-server

# ---- LOGGING PADRAO (ROTACAO JSON) ----
x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

# ---- ANCORAS REUTILIZAVEIS DO SERVICO ----
x-mc-server-common: &mc-server-common
  restart: unless-stopped
  init: true
  tty: true
  stdin_open: true
  stop_grace_period: 60s
  logging: *logging-default
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  mc-server:
    <<: *mc-server-common
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      pull: true
      args:
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-itzg/minecraft-server:java21}
        IMAGE_VERSION: ${IMAGE_VERSION:-0.1.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-local}
      tags:
        - minecraft-core-server:latest
    image: minecraft-core-server:latest
    container_name: minecraft_core_server
    hostname: mc-server

    env_file:
      - path: .env
        required: true

    ports:
      - "${GAME_PORT:-25565}:25565/tcp"
      - "127.0.0.1:${RCON_PORT:-25575}:25575/tcp"

    environment:
      EULA: "${EULA_ACCEPTED}"
      VERSION: "${MINECRAFT_VERSION}"
      TYPE: "${SERVER_TYPE}"
      MEMORY: "${MEMORY_LIMIT}"
      ONLINE_MODE: "${ONLINE_MODE:-FALSE}"
      WHITE_LIST: "${WHITE_LIST:-TRUE}"
      ENFORCE_WHITELIST: "${ENFORCE_WHITELIST:-TRUE}"
      WHITELIST: "${MINECRAFT_WHITELIST}"
      DIFFICULTY: "${DIFFICULTY}"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      USE_AIKAR_FLAGS: "true"
      SYNC_CHUNK_WRITES: "true"
      SKIP_CHOWN: "${SKIP_CHOWN:-false}"

    volumes:
      - type: bind
        source: ../../app/runtime/world
        target: /data/world
        bind:
          create_host_path: true
      - type: bind
        source: ../../app/runtime/configs/server.properties
        target: /data/server.properties
        bind:
          create_host_path: true
      - type: bind
        source: ../../app/runtime/mods
        target: /data/mods
        bind:
          create_host_path: true
      - type: bind
        source: ../../app/runtime/plugins
        target: /data/plugins
        bind:
          create_host_path: true
      - type: bind
        source: ../../app/runtime/logs
        target: /data/logs
        bind:
          create_host_path: true
      - type: bind
        source: ../../app/runtime/database
        target: /data/database
        bind:
          create_host_path: true

    healthcheck:
      test: ["CMD-SHELL", "mc-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    mem_limit: ${MEMORY_LIMIT}
    pids_limit: ${DOCKER_PIDS_LIMIT:-512}

    networks:
      - mc-backend

networks:
  mc-backend:
    name: minecraft-core-network
    driver: bridge
