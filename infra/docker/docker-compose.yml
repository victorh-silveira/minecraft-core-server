# ---- ORQUESTRADOR DO SERVIDOR MINECRAFT (DOCKER COMPOSE) ----
name: minecraft-core-server

# ---- LOGGING PADRAO (ROTACAO JSON) ----
x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

# ---- ANCORAS REUTILIZAVEIS DO SERVICO ----
x-mc-server-common: &mc-server-common
  restart: unless-stopped
  init: true
  tty: true
  stdin_open: true
  stop_grace_period: 60s
  logging: *logging-default
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=${DOCKER_TMPFS_LIMIT:-256m},mode=1777
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  mc-server:
    <<: *mc-server-common
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      pull: true
      args:
        IMAGE_VERSION: ${IMAGE_VERSION:-0.1.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-local}
      tags:
        - minecraft-core-server:latest
    image: minecraft-core-server:latest
    container_name: minecraft_core_server
    hostname: mc-server

    env_file:
      - path: .env
        required: true

    ports:
      - "0.0.0.0:${GAME_PORT:-25565}:25565/tcp"
      - "127.0.0.1:${RCON_PORT:-25575}:25575/tcp"

    environment:
      EULA: "${EULA_ACCEPTED}"
      VERSION: "${MINECRAFT_VERSION:-26.3}"
      TYPE: "${SERVER_TYPE:-FORGE}"
      FORGE_VERSION: "${FORGE_VERSION:-66.0.6}"
      INIT_MEMORY: "${MINECRAFT_INIT_MEMORY:-1G}"
      MAX_MEMORY: "${MINECRAFT_MAX_MEMORY:-1536M}"
      ONLINE_MODE: "${ONLINE_MODE:-FALSE}"
      WHITE_LIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      DIFFICULTY: "${DIFFICULTY}"
      MAX_PLAYERS: "${MAX_PLAYERS}"
      MOTD: |-
        §a§lMinecraft Core Server§r
        §7Forge 26.3 §8• §eSurvival §8• §bKeepInventory
      ICON: "/templates/server-icon.png"
      OVERRIDE_ICON: "true"
      ENABLE_COMMAND_BLOCK: "TRUE"
      OP_PERMISSION_LEVEL: "4"
      FUNCTION_PERMISSION_LEVEL: "4"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_CMDS_STARTUP: |-
        gamerule keep_inventory true
        gamerule players_sleeping_percentage 1
        gamerule command_block_output false
        gamerule send_command_feedback false
      RCON_CMDS_ON_CONNECT: |-
        op AnonymousNoobz
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      USE_AIKAR_FLAGS: "true"
      SYNC_CHUNK_WRITES: "true"
      SKIP_CHOWN: "${SKIP_CHOWN:-false}"

    volumes:
      - type: bind
        source: ../../app/runtime
        target: /data
        bind:
          create_host_path: true

    healthcheck:
      test: ["CMD-SHELL", "mc-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    cpus: ${DOCKER_CPU_LIMIT:-4.0}
    mem_limit: ${DOCKER_MEMORY_LIMIT:-2G}
    mem_reservation: ${DOCKER_MEMORY_RESERVATION:-1536M}
    memswap_limit: ${DOCKER_MEMORY_SWAP_LIMIT:-2G}
    pids_limit: ${DOCKER_PIDS_LIMIT:-512}

    networks:
      - mc-backend

networks:
  mc-backend:
    name: minecraft-core-network
    driver: bridge
